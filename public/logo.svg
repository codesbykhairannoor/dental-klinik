      <stop offset="45%" stop-color="#0077ED" />
      <stop offset="100%" stop-color="#0051B3" />
    </linearGradient>
    <linearGradient id="smileCurveGrad" x1="14" y1="24" x2="34" y2="34" gradientUnits="userSpaceOnUse">
